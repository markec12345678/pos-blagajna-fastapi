<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List · Puter.js</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-top">
        <div class="brand">
          <span class="brand-icon" aria-hidden="true">✓</span>
          <h1>To-Do</h1>
        </div>
        <div class="auth" id="auth-area">
          <button type="button" class="btn btn-ghost" id="sign-in-btn" hidden>Sign in</button>
          <div class="user-chip" id="user-chip" hidden>
            <span class="user-avatar" id="user-avatar">?</span>
            <span class="user-name" id="user-name"></span>
            <button type="button" class="btn btn-ghost btn-sm" id="sign-out-btn">Sign out</button>
          </div>
        </div>
      </div>
      <p class="subtitle">Cloud-synced tasks powered by Puter.js</p>
    </header>

    <main class="main">
      <form class="add-form" id="add-form">
        <input
          type="text"
          id="todo-input"
          class="todo-input"
          placeholder="What needs to be done?"
          autocomplete="off"
          maxlength="500"
        />
        <button type="submit" class="btn btn-primary" id="add-btn">Add</button>
      </form>

      <div class="toolbar">
        <div class="filters" role="tablist" aria-label="Filter tasks">
          <button type="button" class="filter-btn active" data-filter="all">All</button>
          <button type="button" class="filter-btn" data-filter="active">Active</button>
          <button type="button" class="filter-btn" data-filter="completed">Done</button>
        </div>
        <span class="count" id="task-count">0 items</span>
      </div>

      <ul class="todo-list" id="todo-list" aria-label="Tasks"></ul>

      <div class="empty-state" id="empty-state" hidden>
        <div class="empty-icon" aria-hidden="true">📝</div>
        <p>No tasks yet. Add one above!</p>
      </div>

      <div class="actions" id="bulk-actions" hidden>
        <button type="button" class="btn btn-ghost btn-sm" id="clear-completed-btn">Clear completed</button>
        <button type="button" class="btn btn-danger btn-sm" id="clear-all-btn">Clear all</button>
      </div>
    </main>

    <div class="sync-status" id="sync-status" aria-live="polite"></div>

    <footer class="footer">
      <a href="https://developer.puter.com" target="_blank" rel="noopener noreferrer">Powered by Puter</a>
    </footer>
  </div>

  <script src="https://js.puter.com/v2/"></script>
  <script src="app.js"></script>
</body>
</html>
